<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Адмінка | Ska-Tka</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="admin">
<header class="header">
  <div class="header-container">
    <div class="header-left"><a href="index.html" class="logo">Ska-Tka</a></div>
    <nav class="header-nav"><a href="index.html">← На головну</a></nav>
  </div>
</header>
<main class="container" style="padding:40px 20px;">
  <h1 style="font-size:28px;font-weight:900;margin-bottom:25px;">Адмін-панель</h1>

  <div class="ads-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:30px;">
    <div class="ad-card" style="padding:20px;cursor:default;"><div style="font-size:13px;font-weight:800;color:#627d98;">КОРИСТУВАЧІ</div><div id="statUsers" style="font-size:28px;font-weight:900;color:#0077cc;">0</div></div>
    <div class="ad-card" style="padding:20px;cursor:default;"><div style="font-size:13px;font-weight:800;color:#627d98;">ТОВАРИ</div><div id="statProducts" style="font-size:28px;font-weight:900;color:#0077cc;">0</div></div>
    <div class="ad-card" style="padding:20px;cursor:default;"><div style="font-size:13px;font-weight:800;color:#627d98;">ЗАМОВЛЕННЯ</div><div id="statOrders" style="font-size:28px;font-weight:900;color:#0077cc;">0</div></div>
    <div class="ad-card" style="padding:20px;cursor:default;"><div style="font-size:13px;font-weight:800;color:#627d98;">ВИДАЛЕНО</div><div id="statRemoved" style="font-size:28px;font-weight:900;color:#ef4444;">0</div></div>
  </div>

  <h2 style="font-size:20px;font-weight:900;margin-bottom:15px;">Аналітика (за добу)</h2>
  <div class="ads-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:30px;">
    <div class="ad-card" style="padding:16px;cursor:default;"><div style="font-size:12px;font-weight:800;color:#627d98;">ВІЗИТИ</div><div id="anVisits" style="font-size:22px;font-weight:900;">0</div></div>
    <div class="ad-card" style="padding:16px;cursor:default;"><div style="font-size:12px;font-weight:800;color:#627d98;">ПРОСМОТРИ</div><div id="anViews" style="font-size:22px;font-weight:900;">0</div></div>
    <div class="ad-card" style="padding:16px;cursor:default;"><div style="font-size:12px;font-weight:800;color:#627d98;">ВХОДИ</div><div id="anLogins" style="font-size:22px;font-weight:900;">0</div></div>
    <div class="ad-card" style="padding:16px;cursor:default;"><div style="font-size:12px;font-weight:800;color:#627d98;">ЗАМОВЛЕННЯ</div><div id="anOrders" style="font-size:22px;font-weight:900;">0</div></div>
    <div class="ad-card" style="padding:16px;cursor:default;"><div style="font-size:12px;font-weight:800;color:#627d98;">АКТИВНІ</div><div id="anActive" style="font-size:22px;font-weight:900;">0</div></div>
  </div>

  <h2 style="font-size:20px;font-weight:900;margin-bottom:15px;">Користувачі</h2>
  <div style="background:#fff;border-radius:14px;border:1px solid #e2e8f0;overflow:auto;margin-bottom:30px;">
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <thead style="background:#f0f4f8;"><tr>
        <th style="text-align:left;padding:12px;">ID</th><th style="text-align:left;padding:12px;">Email</th>
        <th style="text-align:left;padding:12px;">Імʼя</th><th style="text-align:left;padding:12px;">Роль</th>
        <th style="text-align:left;padding:12px;">Блок</th><th style="padding:12px;"></th>
      </tr></thead>
      <tbody id="adminUsersBody"></tbody>
    </table>
  </div>

  <h2 style="font-size:20px;font-weight:900;margin-bottom:15px;">Товари</h2>
  <div style="background:#fff;border-radius:14px;border:1px solid #e2e8f0;overflow:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <thead style="background:#f0f4f8;"><tr>
        <th style="text-align:left;padding:12px;">ID</th><th style="text-align:left;padding:12px;">Назва</th>
        <th style="text-align:left;padding:12px;">Ціна</th><th style="text-align:left;padding:12px;">Продавець</th>
        <th style="text-align:left;padding:12px;">Статус</th><th style="padding:12px;"></th>
      </tr></thead>
      <tbody id="adminProductsBody"></tbody>
    </table>
  </div>
</main>
<footer class="blue-footer"><div class="container"><div class="footer-brand">Ska-Tka</div></div></footer>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="genericModal">
    <button class="close-modal" id="closeModal">×</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
