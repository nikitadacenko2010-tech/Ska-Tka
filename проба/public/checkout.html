<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформлення | Ska-Tka</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-grid { display: grid; grid-template-columns: 1fr 420px; gap: 40px; padding: 30px 0; }
        .checkout-box { background: #fff; padding: 35px; border-radius: 18px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .suggestions-list { background: #fff; border: 2px solid #0077cc; border-top: none; max-height: 160px; overflow-y: auto; position: absolute; width: 100%; z-index: 99; display: none; border-radius: 0 0 10px 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .suggestions-list div { padding: 10px 15px; cursor: pointer; font-size: 14px; font-weight: 700; color: #102a43; }
        .suggestions-list div:hover { background: #e0f2fe; color: #0077cc; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo">Ska-Tka</a>
                <nav class="header-nav"><a href="category.html">Назад до магазину</a></nav>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="checkout-grid">
            <div class="checkout-box">
                <h2 style="margin-bottom: 22px; font-size: 22px; font-weight: 900; color: #102a43;">Контактні дані</h2>
                <div class="form-row">
                    <div class="form-field"><label>Ім'я *</label><input type="text" id="chName" required placeholder="Іван"></div>
                    <div class="form-field"><label>Прізвище *</label><input type="text" id="chSurname" required placeholder="Петренко"></div>
                </div>
                <div class="form-field">
                    <label>Телефон * (формат: +380XXXXXXXXX)</label>
                    <input type="text" id="chPhone" required placeholder="+380670000000">
                </div>

                <h2 style="margin: 30px 0 18px 0; font-size: 22px; font-weight: 900; color: #102a43;">Дані доставки (Нова пошта)</h2>
                <div class="form-field" style="position:relative;">
                    <label>Місто *</label>
                    <input type="text" id="chCity" required placeholder="Почніть введення міста...">
                    <div id="citySuggestions" class="suggestions-list"></div>
                </div>
                <div class="form-field" style="position:relative;">
                    <label>Відділення *</label>
                    <input type="text" id="chDepartment" required placeholder="№ відділення або поштомат">
                    <div id="deptSuggestions" class="suggestions-list"></div>
                </div>
                
                <button class="action-btn" id="proceedCheckoutBtn" style="margin-top: 25px;">Продовжити</button>
            </div>

            <div class="checkout-box" style="height: fit-content;">
                <h3 style="margin-bottom: 20px; font-size: 20px; font-weight: 900; color: #102a43; border-bottom: 2px solid #edf2f7; padding-bottom: 12px;">Дані замовлення</h3>
                <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 25px;">
                    <img id="summaryImg" src="" alt="" style="width: 70px; height: 70px; object-fit: cover; border-radius: 10px; border: 1px solid #e2e8f0;">
                    <div>
                        <div id="summaryTitle" style="font-weight: 900; font-size: 15px; margin-bottom: 6px; color: #102a43;"></div>
                        <div id="summaryPrice" style="color: #0077cc; font-weight: 900; font-size: 18px;"></div>
                    </div>
                </div>
                <div style="border-top: 2px solid #edf2f7; padding-top: 20px; font-size: 20px; font-weight: 900; display:flex; justify-content:space-between; color:#102a43;">
                    <span>Загалом:</span> <span id="totalText" style="color:#0077cc;">0 грн</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
